<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ytarchive · 라이브 아카이버</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="rec-dot"></span>
      <h1>라이브 아카이버</h1>
      <span class="sub">yt-dlp 엔진</span>
    </div>
    <button id="openFolder" class="ghost-btn" title="저장 폴더 열기">📁 저장 폴더</button>
  </header>

  <!-- 설치 배너 -->
  <section id="setup" class="setup hidden">
    <div class="setup-inner">
      <div class="setup-row">
        <strong id="setupTitle">필수 도구 설치가 필요합니다</strong>
        <button id="setupBtn" class="primary-btn small">자동 설치</button>
      </div>
      <div class="bar"><div id="setupBar" class="bar-fill"></div></div>
      <div id="setupMsg" class="setup-msg">ffmpeg + ytarchive 를 자동으로 내려받습니다.</div>
    </div>
  </section>

  <!-- 입력 -->
  <section class="composer">
    <div class="composer-main">
      <input id="url" type="text" autocomplete="off" spellcheck="false"
             placeholder="유튜브 라이브 링크를 붙여넣으세요  (예: https://www.youtube.com/watch?v=...)">
      <select id="quality" title="화질">
        <option value="best">최고 화질</option>
        <option value="1080p60">1080p60</option>
        <option value="1080p">1080p</option>
        <option value="720p60">720p60</option>
        <option value="720p">720p</option>
        <option value="480p">480p</option>
        <option value="360p">360p</option>
        <option value="audio_only">오디오만</option>
      </select>
      <button id="start" class="primary-btn">▶ 시작</button>
    </div>

    <button id="advToggle" class="adv-toggle">고급 옵션 ▾</button>
    <div id="adv" class="adv hidden">
      <label class="chk"><input type="checkbox" id="optWait" checked> 예약/대기 방송도 기다렸다가 자동 시작</label>
      <label class="chk"><input type="checkbox" id="optThumb" checked> 썸네일 포함</label>
      <label class="chk"><input type="checkbox" id="optMeta" checked> 메타데이터 기록</label>
      <div class="adv-grid">
        <label>다운로드 스레드
          <input type="number" id="optThreads" value="4" min="1" max="8">
        </label>
        <label>재확인 주기(초)
          <input type="number" id="optRetry" value="30" min="0" max="600">
        </label>
        <label class="wide">파일명 템플릿
          <input type="text" id="optOutput" value="%(upload_date)s_%(title)s [%(id)s].%(ext)s">
        </label>
        <label>브라우저 쿠키 (멤버십/로그인 방송)
          <select id="optBrowser">
            <option value="none">사용 안 함</option>
            <option value="chrome">Chrome</option>
            <option value="edge">Edge</option>
            <option value="whale">Whale</option>
            <option value="firefox">Firefox</option>
            <option value="brave">Brave</option>
            <option value="opera">Opera</option>
            <option value="vivaldi">Vivaldi</option>
          </select>
        </label>
        <label>쿠키 파일 경로 (선택)
          <input type="text" id="optCookies" placeholder="예: C:\path\cookies.txt">
        </label>
      </div>
    </div>
  </section>

  <!-- 작업 목록 -->
  <section class="jobs">
    <div class="jobs-head">
      <h2>녹화 작업</h2>
      <span id="jobCount" class="count">0</span>
    </div>
    <div id="jobList" class="job-list"></div>
    <div id="empty" class="empty">아직 작업이 없습니다. 위에 링크를 붙여넣고 <b>시작</b>을 누르세요.</div>
  </section>

  <!-- 저장된 파일 -->
  <section class="files">
    <div class="jobs-head">
      <h2>저장된 파일</h2>
      <span id="fileCount" class="count">0</span>
      <span class="files-hint">📉 분석용 = Claude가 분석할 수 있도록 500MB 미만으로 압축</span>
    </div>
    <div id="fileList" class="file-list"></div>
    <div id="fileEmpty" class="empty">아직 저장된 녹화 파일이 없습니다.</div>
  </section>

  <!-- 로그 모달 -->
  <div id="logModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="logTitle">로그</span>
        <button id="logClose" class="ghost-btn small">닫기 ✕</button>
      </div>
      <pre id="logBody" class="log-body"></pre>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
